<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사 대시보드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --purple:#7C3AED;
    --purple-dark:#5B21B6;
    --purple-light:#EDE9FE;
    --purple-mid:#A78BFA;
    --gray-900:#111827;
    --gray-600:#4B5563;
    --gray-400:#9CA3AF;
    --gray-100:#F3F4F6;
    --border:#E5E7EB;
    --bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--gray-900);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  header{margin-bottom:20px;}
  header h1{font-size:22px;font-weight:700;margin:0 0 4px;}
  header p{margin:0;color:var(--gray-600);font-size:13px;}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .card{
    border:1px solid var(--border);border-radius:14px;padding:18px 18px;
    background:#fff;
  }
  .card .label{font-size:12px;color:var(--gray-600);margin-bottom:8px;}
  .card .value{font-size:26px;font-weight:700;color:var(--purple-dark);line-height:1.2;}
  .card .value small{font-size:14px;font-weight:500;color:var(--gray-600);margin-left:2px;}
  .card .sub{margin-top:8px;font-size:12.5px;color:var(--gray-600);}
  .card .badge{
    display:inline-block;margin-top:8px;padding:3px 9px;border-radius:20px;
    font-size:11.5px;font-weight:600;
  }
  .badge.ok{background:var(--purple-light);color:var(--purple-dark);}
  .badge.warn{background:#F3F4F6;color:var(--gray-600);border:1px solid var(--border);}

  .row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
  .panel{border:1px solid var(--border);border-radius:14px;padding:20px;background:#fff;}
  .panel h2{font-size:14.5px;font-weight:700;margin:0 0 14px;}

  .bar-label{font-size:11px;fill:var(--gray-600);font-family:'Pretendard';}
  .bar-value{font-size:11px;fill:var(--gray-900);font-family:'Pretendard';font-weight:600;}

  .legend{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .legend-item{display:flex;align-items:center;font-size:12.5px;color:var(--gray-600);}
  .legend-dot{width:9px;height:9px;border-radius:50%;margin-right:8px;flex-shrink:0;}
  .legend-item b{color:var(--gray-900);margin-left:auto;font-weight:600;}
  .turnover-line{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
    font-size:12.5px;color:var(--gray-600);display:flex;justify-content:space-between;
  }
  .turnover-line b{color:var(--purple-dark);font-size:15px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--gray-600);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);font-size:11.5px;}
  td{padding:8px;border-bottom:1px solid #F3F4F6;vertical-align:middle;}
  .dept-bar-wrap{background:var(--gray-100);border-radius:6px;height:8px;width:100%;overflow:hidden;}
  .dept-bar{background:var(--purple);height:100%;border-radius:6px;}
  .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .ot-cell{text-align:center;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums;}

  .note{margin-top:18px;font-size:11.5px;color:var(--gray-400);text-align:center;}
  .loading{padding:40px;text-align:center;color:var(--gray-400);font-size:13px;}

  @media(max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>인사 대시보드</h1>
    <p>재직 인원 · 인건비 비중 · 이직률 · 초과근무 현황</p>
  </header>

  <div class="cards" id="cards">
    <div class="loading">불러오는 중...</div>
  </div>

  <div class="row">
    <div class="panel">
      <h2>월별 재직 인원</h2>
      <svg id="chart-monthly" viewBox="0 0 640 240" width="100%" height="240"></svg>
    </div>
    <div class="panel">
      <h2>근속 분포</h2>
      <div style="display:flex;gap:20px;align-items:center;">
        <svg id="chart-donut" viewBox="0 0 180 180" width="150" height="150"></svg>
        <div style="flex:1;">
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div class="turnover-line">
        <span>이직률 (전체 기간 기준)</span>
        <b id="turnover-val">-</b>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="panel">
      <h2>부서별 인건비</h2>
      <table>
        <thead><tr><th style="width:70px;">부서</th><th>인건비</th><th style="width:70px;" class="amt">금액</th><th style="width:50px;" class="amt">인원</th></tr></thead>
        <tbody id="dept-table"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>부서별 초과근무 (월 시간대별 인원수)</h2>
      <table id="ot-table">
        <thead><tr id="ot-head"><th>부서</th></tr></thead>
        <tbody id="ot-body"></tbody>
      </table>
    </div>
  </div>

  <div class="note" id="footnote">데이터는 Supabase와 연결되어 있습니다. 표의 값을 수정하고 새로고침하면 화면에 반영됩니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  "https://amobuwlhzcrppqqmmppd.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtb2J1d2xoemNycHBxcW1tcHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTQxNTAsImV4cCI6MjEwMTI3MDE1MH0.BPVntudlx0HISSMGvOLAGfm8YuXwKlZJVnMC9Hz81gw"
);

const PURPLE_SHADES = ["#5B21B6","#7C3AED","#A78BFA","#C4B5FD","#E9D5FF"];
const fmt = n => Number(n).toLocaleString('ko-KR');

async function main(){
  try{
    const [{data:monthly,error:e1},{data:dept,error:e2},{data:tenure,error:e3},{data:ot,error:e4}] = await Promise.all([
      db.from('hr_monthly').select('*').order('sort_order',{ascending:true}),
      db.from('hr_dept').select('*'),
      db.from('hr_tenure').select('*').order('sort_order',{ascending:true}),
      db.from('hr_overtime').select('*')
    ]);
    if(e1||e2||e3||e4) throw (e1||e2||e3||e4);
    if(!monthly?.length) throw new Error('hr_monthly 데이터가 없습니다.');

    renderCards(monthly);
    renderMonthlyChart(monthly);
    renderDonut(tenure, monthly);
    renderDeptTable(dept);
    renderOvertimeTable(ot);
  }catch(err){
    document.getElementById('cards').innerHTML =
      '<div class="loading">데이터를 불러오지 못했습니다. F12 → Console 탭의 빨간 글씨를 확인해주세요.<br>('+ (err.message||err) +')</div>';
    console.error(err);
  }
}

function renderCards(monthly){
  const cur = monthly[monthly.length-1];
  const prev = monthly[monthly.length-2] || cur;

  const payrollRatio = (cur.payroll / cur.revenue * 100);
  const payrollOk = payrollRatio <= 35;

  const totalLeft = monthly.reduce((s,m)=>s+m.left_count,0);
  const avgHead = monthly.reduce((s,m)=>s+m.headcount,0) / monthly.length;
  const turnover = (totalLeft / avgHead * 100);
  const turnoverOk = turnover <= 12;

  const revPerHead = cur.revenue / cur.headcount;
  const revPerHeadPrev = prev.revenue / prev.headcount;
  const revChange = ((revPerHead - revPerHeadPrev) / revPerHeadPrev * 100);

  document.getElementById('turnover-val').textContent = turnover.toFixed(1)+'%';

  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">재직 인원</div>
      <div class="value">${fmt(cur.headcount)}<small>명</small></div>
      <div class="sub">이번 달 입사 ${cur.joined}명 · 퇴사 ${cur.left_count}명</div>
    </div>
    <div class="card">
      <div class="label">인건비 비중</div>
      <div class="value">${payrollRatio.toFixed(1)}<small>%</small></div>
      <span class="badge ${payrollOk?'ok':'warn'}">기준선 35% ${payrollOk?'이내':'초과'}</span>
    </div>
    <div class="card">
      <div class="label">이직률</div>
      <div class="value">${turnover.toFixed(1)}<small>%</small></div>
      <span class="badge ${turnoverOk?'ok':'warn'}">목표 12% ${turnoverOk?'이내':'초과'}</span>
    </div>
    <div class="card">
      <div class="label">1인당 매출</div>
      <div class="value">${fmt(Math.round(revPerHead))}<small>만원</small></div>
      <div class="sub">전월 대비 ${revChange>=0?'▲':'▼'} ${Math.abs(revChange).toFixed(1)}%</div>
    </div>
  `;
}

function renderMonthlyChart(monthly){
  const w=640,h=240,padB=30,padT=20,padL=10,padR=10;
  const chartH = h-padB-padT;
  const max = Math.max(...monthly.map(m=>m.headcount)) * 1.25;
  const n = monthly.length;
  const gap = 18;
  const barW = (w-padL-padR-gap*(n-1))/n;

  let bars='';
  monthly.forEach((m,i)=>{
    const x = padL + i*(barW+gap);
    const barH = (m.headcount/max)*chartH;
    const y = padT + (chartH-barH);
    const isLast = i===n-1;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4"
      fill="${isLast?'var(--purple)':'var(--purple-light)'}"></rect>`;
    bars += `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="bar-value">${m.headcount}</text>`;
    bars += `<text x="${x+barW/2}" y="${h-8}" text-anchor="middle" class="bar-label">${m.month}</text>`;
  });
  document.getElementById('chart-monthly').innerHTML = bars;
}

function renderDonut(tenure, monthly){
  const total = tenure.reduce((s,t)=>s+t.count,0);
  const r=60,cx=90,cy=90,sw=26;
  const circ = 2*Math.PI*r;
  let acc=0, circles='';
  tenure.forEach((t,i)=>{
    const frac = t.count/total;
    const len = frac*circ;
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${PURPLE_SHADES[i%PURPLE_SHADES.length]}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-acc}"
      transform="rotate(-90 ${cx} ${cy})"></circle>`;
    acc += len;
  });
  circles += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="24" font-weight="700" fill="var(--gray-900)" font-family="Pretendard">${total}</text>`;
  circles += `<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" fill="var(--gray-600)" font-family="Pretendard">총 인원(명)</text>`;
  document.getElementById('chart-donut').innerHTML = circles;

  const legend = tenure.map((t,i)=>`
    <div class="legend-item">
      <span class="legend-dot" style="background:${PURPLE_SHADES[i%PURPLE_SHADES.length]}"></span>
      ${t.bucket} <b>${t.count}명</b>
    </div>`).join('');
  document.getElementById('legend').innerHTML = legend;
}

function renderDeptTable(dept){
  const max = Math.max(...dept.map(d=>d.payroll));
  document.getElementById('dept-table').innerHTML = dept.map(d=>`
    <tr>
      <td>${d.dept}</td>
      <td><div class="dept-bar-wrap"><div class="dept-bar" style="width:${(d.payroll/max*100).toFixed(0)}%"></div></div></td>
      <td class="amt">${fmt(d.payroll)}</td>
      <td class="amt">${d.headcount}</td>
    </tr>`).join('');
}

function renderOvertimeTable(ot){
  const buckets = ['0h','1-10','11-20','21-30','30h+'];
  const depts = [...new Set(ot.map(o=>o.dept))];
  const max = Math.max(...ot.map(o=>o.count));

  document.getElementById('ot-head').innerHTML =
    '<th>부서</th>' + buckets.map(b=>`<th style="text-align:center;">${b}</th>`).join('');

  document.getElementById('ot-body').innerHTML = depts.map(dept=>{
    const cells = buckets.map(b=>{
      const rec = ot.find(o=>o.dept===dept && o.bucket===b);
      const count = rec ? rec.count : 0;
      const opacity = (count/max*0.85+0.1).toFixed(2);
      const textColor = opacity>0.55 ? '#fff' : 'var(--gray-900)';
      return `<td class="ot-cell" style="background:rgba(124,58,237,${opacity});color:${textColor};">${count}</td>`;
    }).join('');
    return `<tr><td>${dept}</td>${cells}</tr>`;
  }).join('');
}

main();
</script>
</body>
</html>
